<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<rect width="1000" height="460" fill="#0b1420"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e2eeee">
<text x="40" y="45" font-size="25" font-weight="bold">ESP32 + SSD1306 OLED · connect by printed labels</text>
<rect x="60" y="100" width="300" height="255" rx="20" fill="#18333e" stroke="#6ed9c0"/>
<text x="85" y="137" font-size="22">38-pin ESP32-WROOM</text>
<text x="85" y="168" font-size="15" fill="#a7becb">Logical wiring, not physical pin positions</text>
<rect x="690" y="100" width="250" height="255" rx="20" fill="#14283f" stroke="#85bdf6"/>
<text x="712" y="138" font-size="20">0.96-inch SSD1306</text><text x="712" y="165" font-size="16" fill="#a7becb">128 × 64 · I2C · 0x3C</text>
<g font-size="20"><text x="260" y="205">3V3</text><text x="710" y="205">VCC</text><text x="260" y="246">GND</text><text x="710" y="246">GND</text><text x="230" y="287">GPIO21</text><text x="710" y="287">SDA</text><text x="230" y="328">GPIO22</text><text x="710" y="328">SCL</text></g>
<text x="60" y="402" font-size="18">ESP32 USB → laptop USB data cable. OLED power → 3V3.</text>
<text x="60" y="432" font-size="15" fill="#a7becb">Check each module's printed labels; connector order varies between boards.</text></g>
<g stroke-width="4" fill="none"><path d="M340 200H690" stroke="#f37d7d"/><path d="M340 241H690" stroke="#a4b0c0"/><path d="M340 282H690" stroke="#75df9b"/><path d="M340 323H690" stroke="#f0d573"/></g>
</svg>
